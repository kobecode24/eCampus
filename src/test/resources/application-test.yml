# Test environment configuration
spring:
  # Database configuration - using H2 in-memory database for testing
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: password
    driver-class-name: org.h2.Driver

  # JPA/Hibernate configuration
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: true

  # Disable Flyway for tests if you're using it
  flyway:
    enabled: false

  # Jackson configuration for date/time serialization
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss

  # Disable discovery of database migrations for tests
  liquibase:
    enabled: false

# Server configuration
server:
  port: 0  # Random port for parallel test execution
  servlet:
    context-path: /api

# JWT Configuration with testing keys
jwt:
  secret: VerySecureTestingSecretKeyThatIsOnlyUsedForTestingPurposesAndNotInProduction
  expirationTime: 3600000  # 1 hour in milliseconds
  refreshExpirationTime: 86400000  # 24 hours in milliseconds
  tokenPrefix: "Bearer "
  headerString: "Authorization"

# Logging configuration for tests
logging:
  level:
    root: WARN
    org.springframework: INFO
    org.doctech: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Cloud storage testing configuration - mock instead of actual cloud
cloudinary:
  cloud-name: test-cloud
  api-key: test-api-key
  api-secret: test-api-secret

spring:
  application:
    name: ecampus

  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/doctech
    username: postgres
    password: toor
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      pool-name: DocTechHikariCP

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  # Liquibase Configuration
  liquibase:
    enabled: true
    change-log: db/changelog/db.changelog-master.yaml
    default-schema: public

  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    mapper:
      default-view-inclusion: true

  # Mail Configuration (if needed)
  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: your-app-specific-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /api
  compression:
    enabled: true
  error:
    include-message: always
    include-binding-errors: always

# JWT Configuration
jwt:
  secret: your_very_long_and_secure_jwt_secret_key_here_make_it_at_least_256_bits
  expiration-time: 86400000  # 24 hours in milliseconds
  token-prefix: "Bearer "
  header-string: "Authorization"

# Logging Configuration
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate: INFO
    org.doctech: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/doctech.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  packages-to-scan: org.doctech
  paths-to-match: /api/**

# Custom Application Properties
app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:4200
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    max-age: 3600
  upload:
    directory: uploads
    max-file-size: 10MB
    allowed-types: image/jpeg,image/png,application/pdf
  cache:
    ttl: 3600
  points:
    initial: 0
    level-up-threshold: 1000
  security:
    password:
      min-length: 8
      require-special-char: true
      require-number: true
      require-uppercase: true
    max-login-attempts: 5
    lock-duration-minutes: 30

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/doctech_dev

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate: DEBUG
    org.doctech: TRACE

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://prod-db-server:5432/doctech_prod

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

server:
  port: 80

logging:
  level:
    root: WARN
    org.springframework.web: ERROR
    org.hibernate: ERROR
    org.doctech: INFO
# 012-add-auditing-fields.yaml
databaseChangeLog:
  - changeSet:
      id: 012-add-audit-fields-to-blog
      author: doctech
      changes:
        - addColumn:
            tableName: blogs
            columns:
              - column:
                  name: created_by
                  type: uuid
                  constraints:
                    foreignKeyName: fk_blog_creator
                    references: users(id)
              - column:
                  name: last_modified_by
                  type: uuid
                  constraints:
                    foreignKeyName: fk_blog_modifier
                    references: users(id)
              - column:
                  name: last_modified_at
                  type: timestamp

